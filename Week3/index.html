<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One of my favorite video games</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Style the entire webpage */
        body {
            background-color: #cce7ff;
            font-family: Arial, sans-serif;
        }

        /* Style the parent card */
        .card {
            width: 500px;
            height: 750px;
            background-color: #ffffff;
            padding: 36px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        /* Style the image inside the card */
        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        /* Style the heading */
        .card h1 {
            font-family: 'Roboto', sans-serif;
            color: #228b22;
            font-size: 32px;
        }

        /* Style the description */
        .card p {
            font-size: 16px;
            color: #333333;
            line-height: 1.6;
        }

        /* Style the button */
        .card button {
            background-color: #228b22;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .card button:hover {
            background-color: #176b17;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="minecraft.jpg" alt="Minecraft Game">

        <h1>Minecraft</h1>

        <p>
            Minecraft is one of my favorite video games.
            It allows players to explore different worlds,
            build creative structures, and survive against
            different enemies. I enjoy Minecraft because
            it encourages creativity, exploration, and
            problem-solving.
        </p>

        <a href="https://www.minecraft.net" target="_blank" rel="noopener noreferrer">
            <button type="button">Learn More</button>
        </a>

    </div>

</body>
</html>
